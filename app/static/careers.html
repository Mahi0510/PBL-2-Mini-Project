<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Careers | Join Our Team</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 450px; border-top: 6px solid #2563eb; }
        h1 { margin-top: 0; color: #0f172a; text-align: center; }
        p { color: #64748b; text-align: center; font-size: 14px; margin-bottom: 25px; }
        label { font-weight: bold; font-size: 13px; color: #334155; margin-top: 10px; display: block; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        .btn { padding: 15px; border: none; border-radius: 8px; background: #2563eb; color: white; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; }
        .btn:hover { background: #1d4ed8; }
        #msg { display: none; color: #059669; background: #d1fae5; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Join the Team</h1>
        <p>Submit your application and resumes for instant AI screening.</p>
        
        <form id="applyForm" onsubmit="submitApp(event)">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="E.g. Aryan Naik" required>
            
            <label>Email Address</label>
            <input type="email" id="email" placeholder="aryan@example.com" required>
            
            <label>Target Role</label>
            <select id="role">
                <option value="Python Developer">Python Developer</option>
                <option value="Data Analyst">Data Analyst</option>
                <option value="Frontend Developer">Frontend Developer</option>
                <option value="AI ML Intern">AI ML Intern</option>
                <option value="Cybersecurity Intern">Cybersecurity Intern</option>
            </select>

            <label>Upload Resumes (PDF Only, Bulk Upload Supported)</label>
            <input type="file" id="resumes" accept=".pdf" multiple required style="background: #f1f5f9; padding: 20px;">
            <p style="font-size: 11px; margin: 0 0 15px 0; text-align:left;">💡 Hold Ctrl (Windows) or Cmd (Mac) to select multiple files.</p>
            
            <button type="submit" class="btn" id="subBtn">Submit Application</button>
        </form>
        <div id="msg">🎉 Application Received! HR is reviewing your profile.</div>
    </div>

    <script>
        async function submitApp(e) {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            btn.innerText = "Scanning & Analyzing...";
            btn.disabled = true;

            const fd = new FormData();
            fd.append("name", document.getElementById('name').value);
            fd.append("email", document.getElementById('email').value);
            fd.append("role", document.getElementById('role').value);

            const fileInput = document.getElementById('resumes');
            for (let i = 0; i < fileInput.files.length; i++) {
                fd.append("resumes", fileInput.files[i]);
            }

            try {
                const response = await fetch('/apply', {method:'POST', body:fd});
                const data = await response.json();
                if(response.ok && !data.error) {
                    document.getElementById('applyForm').style.display = 'none';
                    document.getElementById('msg').style.display = 'block';
                } else {
                    alert("Submission Error: " + (data.error || "Invalid file"));
                    btn.innerText = "Submit Application";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Server error. Please ensure the backend is running.");
                btn.innerText = "Submit Application";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
